name: Release & SignPath Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_ISOLATED_TEST: "1"
      FOUNDATION_SUPPRESS_MODALS: "1"
    outputs:
      artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Dev/Housekeeping.Web/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version & acquire Foundation SDK (v0.5.3 with v0.5.2 fallback)
        id: meta
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          if ($tagName -match '^v(.+)$') {
            $ver = $matches[1]
          } else {
            $ver = (Get-Content -LiteralPath "Dev/version.txt" -Raw).Trim().TrimStart('v', 'V')
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $sdkVer = "0.5.3"
          if (Test-Path -LiteralPath "Dev/suite.manifest.json") {
            $manifest = Get-Content -LiteralPath "Dev/suite.manifest.json" -Raw | ConvertFrom-Json
            if (-not [string]::IsNullOrWhiteSpace([string]$manifest.sdkVersion)) {
              $sdkVer = ([string]$manifest.sdkVersion).Trim().TrimStart('v', 'V')
            }
          }

          $tmpZip = Join-Path $env:RUNNER_TEMP "Foundation-sdk.zip"
          $tmpSdk = Join-Path $env:RUNNER_TEMP "FoundationSdk"
          $primaryUrl = "https://github.com/StreamItAllGit/Foundation/releases/download/v$sdkVer/Foundation-v$sdkVer.zip"
          try {
            Write-Host "Fetching Foundation SDK v$sdkVer from $primaryUrl..."
            Invoke-WebRequest -Uri $primaryUrl -OutFile $tmpZip -UseBasicParsing
          } catch {
            if ($sdkVer -eq "0.5.2") { throw }
            Write-Warning "Foundation SDK v$sdkVer unavailable upstream ($($_.Exception.Message)); falling back to v0.5.2."
            $fallbackUrl = "https://github.com/StreamItAllGit/Foundation/releases/download/v0.5.2/Foundation-v0.5.2.zip"
            Invoke-WebRequest -Uri $fallbackUrl -OutFile $tmpZip -UseBasicParsing
          }

          if (Test-Path $tmpSdk) { Remove-Item $tmpSdk -Recurse -Force }
          Expand-Archive -Path $tmpZip -DestinationPath $tmpSdk -Force
          New-Item -ItemType Directory -Path "Dev/lib" -Force | Out-Null
          Copy-Item (Join-Path $tmpSdk "Foundation.*") "Dev/lib/" -Force
          foreach ($subName in @("WebAssets", "foundation_core")) {
            $subPath = Join-Path $tmpSdk $subName
            if (Test-Path $subPath) { Copy-Item $subPath "Dev/lib/" -Recurse -Force }
          }
          if (Test-Path (Join-Path $tmpSdk "sdk-manifest.json")) {
            Copy-Item (Join-Path $tmpSdk "sdk-manifest.json") "Dev/lib/sdk-manifest.json" -Force
          }

      - name: Build SPA, verify UI hints & run isolated .NET tests
        run: |
          npm --prefix Dev/Housekeeping.Web ci
          npx --prefix Dev/Housekeeping.Web tsc --noEmit
          npm --prefix Dev/Housekeeping.Web run build
          node Dev/scripts/verify_ui_hints.mjs
          dotnet test Dev/Housekeeping.slnx -c Release -p:TreatWarningsAsErrors=true -nodeReuse:false --logger "console;verbosity=minimal"

      - name: Package & verify unsigned 7-file release bundle
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File Dev/scripts/build_installer.ps1 -Version $ver -SkipSigning

          $latestDir = "Releases/Latest"
          $sumsPath = Join-Path $latestDir "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $sumsPath)) {
            throw "Missing SHA256SUMS.txt in $latestDir"
          }
          foreach ($line in (Get-Content -LiteralPath $sumsPath -Encoding UTF8)) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s+', 2
            $expectedHash = $parts[0].Trim().ToUpperInvariant()
            $fileName = $parts[1].Trim()
            $targetFile = Join-Path $latestDir $fileName
            if (-not (Test-Path -LiteralPath $targetFile)) {
              throw "SHA256SUMS.txt references missing artifact: $fileName"
            }
            $actualHash = (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $fileName (expected $expectedHash, got $actualHash)"
            }
          }

          New-Item -ItemType Directory -Path "ci-bundle" -Force | Out-Null
          Get-ChildItem $latestDir -File | Where-Object { $_.Name -notlike "*-Setup-*.exe" -and $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            Copy-Item $_.FullName "ci-bundle/" -Force
          }
          if (Test-Path -LiteralPath "Releases/Latest.7z") {
            Copy-Item "Releases/Latest.7z" "ci-bundle/Latest.7z" -Force
          }

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: Releases/Latest/*-Setup-*.exe
          if-no-files-found: error

      - name: Upload remaining release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: ci-bundle/*
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-latest
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Regenerate SHA256SUMS.txt & verify signed bundle
        id: relmeta
        shell: pwsh
        run: |
          $bundleFiles = @(Get-ChildItem "dist" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Name -ne "Latest.7z" } | Sort-Object { $_.Name.ToLowerInvariant() })
          if (-not ($bundleFiles | Where-Object { $_.Name -like "Housekeeping-Setup-*.exe" })) {
            throw "Signed Setup installer missing in dist/"
          }
          $lines = $bundleFiles | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
            "$h  $($_.Name)"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path "dist").Path + "\SHA256SUMS.txt", ($lines -join "`n") + "`n", $utf8NoBom)

          $ver = "${{ needs.build.outputs.version }}"
          $isPre = if ($ver -match '^0\.|-(alpha|beta|rc|nightly|hf)') { "true" } else { "false" }
          "prerelease=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/*

      - name: Publish signed assets to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ("${{ steps.relmeta.outputs.prerelease }}" -eq "true") { @("--prerelease") } else { @() }
            gh release create $tag @pre --title "Housekeeping $tag" --notes-file "dist/RELEASE_NOTES.md"
          }
          $assets = @(Get-ChildItem "dist" -File | Where-Object { $_.Name -ne "Latest.7z" } | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --clobber
